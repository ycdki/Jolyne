<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>切图工具 - 全能增强版</title>
    <style>
        :root { --primary: #0ea5e9; --bg: #f8fafc; --border: #cbd5e1; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: #1e293b; max-width: 900px; margin: 0 auto; padding: 30px 20px; }
        .card { background: white; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); padding: 24px; }
        h1 { margin: 0 0 20px 0; font-size: 22px; color: #0f172a; display: flex; justify-content: space-between; align-items: center; }
        
        /* 拖拽区样式 */
        .drop-zone { border: 2px dashed #94a3b8; border-radius: 8px; padding: 30px 20px; text-align: center; background: #f8fafc; cursor: pointer; transition: all 0.2 ease; margin-bottom: 24px; }
        .drop-zone.dragover { border-color: var(--primary); background: #e0f2fe; transform: scale(1.01); }
        .drop-zone-title { font-size: 16px; font-weight: 600; color: #334155; margin-bottom: 8px; }
        .drop-zone-desc { font-size: 13px; color: #64748b; }

        .setup-group { margin-bottom: 20px; background: #f1f5f9; padding: 16px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .setup-title { font-weight: 600; margin-bottom: 12px; color: #334155; font-size: 15px; }
        
        .radio-item { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; font-size: 14px; cursor: pointer; }
        .radio-item:last-child { margin-bottom: 0; }
        
        input[type="text"] { padding: 4px 8px; border: 1px solid #94a3b8; border-radius: 4px; font-size: 13px; outline: none; width: 100px; }
        input[type="text"]:focus { border-color: var(--primary); }
        
        .action-zone { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .action-hint { font-size: 13px; color: #64748b; }
        button { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2; font-size: 15px; }
        button:hover { background: #0284c7; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }

        #log { background: #1e293b; color: #e2e8f0; border-radius: 8px; padding: 15px; font-family: 'Consolas', monospace; font-size: 13px; height: 350px; overflow-y: auto; margin-top: 20px; line-height: 1.6; }
        .log-info { color: #38bdf8; }
        .log-success { color: #4ade80; }
        .log-error { color: #f87171; }
        .log-warn { color: #facc15; }
    </style>
</head>
<body>

<div class="card">
    <h1>🧩 图片分割处理</h1>
    
    <div id="drop-zone" class="drop-zone">
        <div class="drop-zone-title">拖拽图片到此</div>
        <div class="drop-zone-desc">支持单张或多张拖拽</div>
    </div>
    
    <div class="setup-group">
        <div class="setup-title">1. 切割模式 & 图像优化</div>
        <div style="display: flex; gap: 20px; margin-bottom: 15px;">
            <label class="radio-item">
                <input type="radio" name="gridMode" value="2" checked> 四宫格 (2x2)
            </label>
            <label class="radio-item">
                <input type="radio" name="gridMode" value="3"> 九宫格 (3x3)
            </label>
        </div>
        <div style="padding-top: 12px; border-top: 1px dashed #cbd5e1;">
            <label class="radio-item" style="color: #0369a1; font-weight: 500;">
                <input type="checkbox" id="zoom-toggle"> 
                中心放大 10%
            </label>
        </div>
    </div>
    
    <div class="setup-group">
        <div class="setup-title">2. 批量扫描范围 </div>
        <label class="radio-item">
            <input type="radio" name="scanMode" value="root"> 
            单独：只处理当前选中的根目录（不扫子文件夹）
        </label>
        <label class="radio-item">
            <input type="radio" name="scanMode" value="all"> 
            遍历：处理所有子文件夹里的图片
        </label>
        <label class="radio-item">
            <input type="radio" name="scanMode" value="specific" checked> 
            精准：寻找并只处理名为 <input type="text" id="target-name" value="Output"> 的子文件夹
        </label>
    </div>

    <div class="action-zone">
        <div class="action-hint"></div>
        <button id="start-btn">📁 选择根目录</button>
    </div>

    <div id="log">
        <div style="color: #94a3b8;">> 工具准备就绪。您可以拖拽图片，或者点击按钮扫描文件夹...</div>
    </div>
</div>

<script>
    const logEl = document.getElementById('log');
    const startBtn = document.getElementById('start-btn');
    const dropZone = document.getElementById('drop-zone');
    
    function appendLog(msg, type = 'info') {
        const div = document.createElement('div');
        div.className = `log-${type}`;
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logEl.appendChild(div);
        logEl.scrollTop = logEl.scrollHeight;
    }

    // --- 核心：切图算法 (提取为通用函数，支持放大去白边) ---
    async function processCanvasSlicing(file, targetDirHandle) {
        const grid = parseInt(document.querySelector('input[name="gridMode"]:checked').value);
        const isZoomEnabled = document.getElementById('zoom-toggle').checked;
        const scale = isZoomEnabled ? 1.1 : 1.0;

        const img = await new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = (e) => {
                const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = e.target.result;
            };
            r.readAsDataURL(file);
        });

        const w = Math.floor(img.width / grid);
        const h = Math.floor(img.height / grid);
        
        // 在目标目录下创建与原图同名的子文件夹
        const folderName = file.name.replace(/\.[^/.]+$/, "");
        const subDir = await targetDirHandle.getDirectoryHandle(folderName, { create: true });

        for (let r = 0; r < grid; r++) {
            for (let c = 0; c < grid; c++) {
                const cvs = document.createElement('canvas');
                cvs.width = w; cvs.height = h;
                const ctx = cvs.getContext('2d');
                
                const sourceW = w / scale;
                const sourceH = h / scale;
                const offsetX = (w - sourceW) / 2;
                const offsetY = (h - sourceH) / 2;
                
                const sx = c * w + offsetX;
                const sy = r * h + offsetY;

                ctx.drawImage(img, sx, sy, sourceW, sourceH, 0, 0, w, h);
                
                const blob = await new Promise(res => cvs.toBlob(res, 'image/jpeg', 0.95));
                const fh = await subDir.getFileHandle(`part_${r+1}_${c+1}.jpg`, { create: true });
                const wr = await fh.createWritable();
                await wr.write(blob);
                await wr.close();
            }
        }
        appendLog(`  ✅ 切图完成: ${file.name} ${isZoomEnabled ? '(已去白边)' : ''}`, 'success');
    }


    // --- 模块 A：拖拽快速处理逻辑 ---
    dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
    });

    dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
    });

    dropZone.addEventListener('drop', async (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');

        const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
        if (files.length === 0) {
            appendLog('⚠️ 未检测到有效图片，请重新拖拽。', 'warn');
            return;
        }

        try {
            appendLog(`📥 接收到 ${files.length} 张拖拽图片，请选择存放切片的文件夹...`, 'info');
            // 拖拽模式下，必须手动选择一个输出文件夹
            const outputDirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
            
            for (const file of files) {
                await processCanvasSlicing(file, outputDirHandle);
            }
            appendLog('🏁 拖拽图片全部处理完毕！', 'success');
        } catch (err) {
            if(err.name === 'AbortError') {
                appendLog('已取消选择保存位置。', 'warn');
            } else {
                appendLog('发生错误: ' + err.message, 'error');
            }
        }
    });


    // --- 模块 B：批量扫描处理逻辑 ---
    async function scanAndProcess(dirHandle, currentDepth = 0, path = '') {
        const mode = document.querySelector('input[name="scanMode"]:checked').value;
        const targetName = document.getElementById('target-name').value.trim();
        const currentPath = path ? `${path}/${dirHandle.name}` : dirHandle.name;

        let shouldProcessHere = false;
        let shouldRecurse = false;

        if (mode === 'root') {
            shouldProcessHere = (currentDepth === 0);
            shouldRecurse = false;
        } else if (mode === 'all') {
            shouldProcessHere = true;
            shouldRecurse = true;
        } else if (mode === 'specific') {
            shouldProcessHere = (dirHandle.name === targetName);
            shouldRecurse = true;
        }

        if (shouldProcessHere) {
            let hasImage = false;
            for await (const entry of dirHandle.values()) {
                if (entry.kind === 'file' && entry.name.match(/\.(jpg|jpeg|png|webp)$/i)) {
                    hasImage = true; break;
                }
            }
            if (hasImage) {
                appendLog(`\n🔍 锁定目标目录: ${currentPath}`, 'info');
            }
        }

        for await (const entry of dirHandle.values()) {
            if (entry.kind === 'file') {
                if (shouldProcessHere && entry.name.match(/\.(jpg|jpeg|png|webp)$/i)) {
                    const file = await entry.getFile();
                    // 文件夹扫描模式下，目标目录就是图片所在的当前目录 (dirHandle)
                    await processCanvasSlicing(file, dirHandle);
                }
            } else if (entry.kind === 'directory') {
                if (shouldRecurse) {
                    await scanAndProcess(entry, currentDepth + 1, currentPath);
                }
            }
        }
    }

    startBtn.onclick = async () => {
        const mode = document.querySelector('input[name="scanMode"]:checked').value;
        if (mode === 'specific' && !document.getElementById('target-name').value.trim()) {
            appendLog('⚠️ 错误：选择精准模式时，必须填写目标文件夹名称！', 'error');
            return;
        }

        try {
            const rootHandle = await window.showDirectoryPicker();
            startBtn.disabled = true;
            logEl.innerHTML = '';
            appendLog('🚀 开始执行批量文件夹扫描任务...');
            
            await scanAndProcess(rootHandle);
            
            appendLog('\n🏁 文件夹扫描任务已全部完成！', 'success');
        } catch (e) {
            if(e.name === 'AbortError') {
                appendLog('已取消选择。', 'warn');
            } else {
                appendLog('扫描过程发生错误: ' + e.message, 'error');
            }
        } finally {
            startBtn.disabled = false;
        }
    };
</script>

</body>
</html>
